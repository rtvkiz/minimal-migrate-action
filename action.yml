name: "Migrate to minimal hardened images"
description: >
  Scans Dockerfiles in this repository for base images that have a hardened,
  minimal-CVE equivalent in the minimal catalog (minimalcontainers.com), and
  opens a pull request swapping matching FROM lines to the minimal image.
author: "rtvkiz"
branding:
  icon: "shield"
  color: "green"

inputs:
  dockerfile-glob:
    description: "Glob pattern (relative to repo root) for Dockerfiles to scan"
    required: false
    default: "**/Dockerfile*"
  base-branch:
    description: "Branch to open the PR against"
    required: false
    default: ${{ github.event.repository.default_branch }}
  pr-branch:
    description: "Branch name to create for the migration PR"
    required: false
    default: "minimal-migrate"
  dry-run:
    description: "If true, report matches but do not write changes or open a PR"
    required: false
    default: "false"
  github-token:
    description: "Token used to open the pull request"
    required: false
    default: ${{ github.token }}

outputs:
  changes-count:
    description: "Number of FROM lines rewritten"
    value: ${{ steps.migrate.outputs.changes-count }}
  skipped-count:
    description: "Number of FROM lines matched by name but left unchanged because minimal has no published version compatible with the requested tag"
    value: ${{ steps.migrate.outputs.skipped-count }}
  pull-request-url:
    description: "URL of the opened pull request, if any"
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: "composite"
  steps:
    - name: Run migration scan
      id: migrate
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/scripts/migrate.py" \
          --root "${GITHUB_WORKSPACE}" \
          --glob "${{ inputs.dockerfile-glob }}" \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }} \
          --output /tmp/minimal-migrate-changes.json
        changes=$(python3 -c "import json; print(len(json.load(open('/tmp/minimal-migrate-changes.json'))['changes']))")
        skipped=$(python3 -c "import json; print(len(json.load(open('/tmp/minimal-migrate-changes.json'))['skipped']))")
        echo "changes-count=${changes}" >> "$GITHUB_OUTPUT"
        echo "skipped-count=${skipped}" >> "$GITHUB_OUTPUT"

        if [ "${skipped}" != "0" ]; then
          {
            echo "### minimal-migrate: ${skipped} FROM line(s) skipped (no compatible minimal version)"
            echo
            python3 "${{ github.action_path }}/scripts/summarize_skipped.py" /tmp/minimal-migrate-changes.json
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Open pull request
      id: pr
      if: inputs.dry-run != 'true' && steps.migrate.outputs.changes-count != '0'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github-token }}
        branch: ${{ inputs.pr-branch }}
        base: ${{ inputs.base-branch }}
        commit-message: "chore: migrate base images to minimal hardened equivalents"
        title: "Migrate base images to minimal (hardened, low-CVE) equivalents"
        body: >
          Opened automatically by
          [minimal-migrate-action](https://github.com/rtvkiz/minimal-migrate-action).


          This PR swaps one or more `FROM` base images for their hardened
          equivalent from the [minimal](https://minimalcontainers.com)
          catalog — free, MIT-licensed, cosign-signed, SBOM-attested, and
          rebuilt daily to keep CVE counts near zero.


          Each rewritten line keeps the version you had pinned, resolved to
          the matching minimal tag (or `:latest` if the original FROM line
          had no version pin). A FROM line was only rewritten if minimal
          actually publishes a compatible version — see the workflow run
          summary for any lines that were left untouched because no
          compatible minimal version exists yet.


          **Review before merging:** confirm the resolved tag is the one
          you expect before merging.
        labels: dependencies
